  15, 21, 28, 36","choices":["40","42","43","45","49"],"explanation":"Ce sont les nombres triangulaires n(n+1)/2 ; le suivant est 45.","hint":"Observe les différences croissantes."},"en":{"prompt":"Which number shares the property common to both groups?","context":"1, 3, 6, 10  ·  15, 21, 28, 36","choices":["40","42","43","45","49"],"explanation":"These are triangular numbers n(n+1)/2; the next is 45.","hint":"Look for increasing differences."}}},{"id":"T-A-01","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":1,"estimatedSeconds":95,"correctAnswer":"1","status":"pilot","content":{"fr":{"prompt":"Quel élément remet le plus en cause le lien de causalité ?","context":"Une ville a installé de nouveaux bancs. Les visites du parc ont augmenté le même mois.","choices":["Les bancs sont bleus.","Le même mois, un festival gratuit a commencé dans le parc.","Les bancs sont en bois.","La ville compte plusieurs parcs.","Les bancs coûtent cher."],"explanation":"Le festival constitue une explication concurrente de la hausse de fréquentation.","hint":"Cherche une cause alternative."},"en":{"prompt":"Which fact most weakens the causal claim?","context":"A city installed new benches. Park visits increased in the same month.","choices":["The benches are blue.","A free festival started in the park that same month.","The benches are wooden.","The city has several parks.","The benches were expensive."],"explanation":"The festival provides an alternative explanation for the increase.","hint":"Look for an alternative cause."}}},{"id":"T-A-02","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":2,"estimatedSeconds":115,"correctAnswer":"3","status":"pilot","content":{"fr":{"prompt":"Quelle hypothèse est nécessaire à cette généralisation ?","context":"Un sondage réalisé uniquement auprès des abonnés d’une revue conclut que toute la ville souhaite davantage de magazines.","choices":["Les magazines ont des couvertures colorées.","La revue existe depuis dix ans.","Il y a plus d’un magazine en ville.","Les abonnés interrogés représentent raisonnablement les préférences de la ville.","Les abonnés connaissent les journalistes."],"explanation":"La conclusion ne vaut pour la population entière que si l’échantillon n’est pas trop biaisé.","hint":"Compare la population interrogée à la population visée."},"en":{"prompt":"What assumption is needed for this generalization?","context":"A survey of a magazine’s subscribers concludes that the whole city wants more magazines.","choices":["Magazines have colorful covers.","The magazine has existed for ten years.","More than one magazine is sold in town.","The surveyed subscribers reasonably represent the city’s preferences.","Subscribers know the reporters."],"explanation":"Generalizing to the whole city requires a sufficiently representative sample.","hint":"Compare the sample with the target population."}}},{"id":"T-A-03","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":2,"estimatedSeconds":115,"correctAnswer":"2","status":"pilot","content":{"fr":{"prompt":"Quelle conclusion est nécessairement vraie ?","context":"Tous les membres du club A parlent espagnol. Certains étudiants du lycée sont membres du club A.","choices":["Tous les étudiants parlent espagnol.","Aucun étudiant ne parle espagnol.","Certains étudiants parlent espagnol.","Tous les hispanophones sont membres du club A.","Tous les membres du club A sont étudiants."],"explanation":"Les étudiants appartenant au club A parlent espagnol, donc certains étudiants le parlent.","hint":"Suis le groupe commun aux deux propositions."},"en":{"prompt":"Which conclusion must be true?","context":"Every member of club A speaks Spanish. Some high-school students belong to club A.","choices":["All students speak Spanish.","No student speaks Spanish.","Some students speak Spanish.","Every Spanish speaker belongs to club A.","All club A members are students."],"explanation":"Students who belong to club A speak Spanish, so some students speak Spanish.","hint":"Trace the group shared by both statements."}}},{"id":"T-A-04","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":3,"estimatedSeconds":135,"correctAnswer":"4","status":"pilot","content":{"fr":{"prompt":"Quelle erreur fragilise l’argument ?","context":"Les magasins ouverts tard vendent plus. Un commerçant conclut qu’ouvrir tard augmente nécessairement les ventes.","choices":["Comparer deux magasins.","Utiliser des chiffres de ventes.","Observer une corrélation.","Raisonner sur des horaires.","Confondre corrélation et causalité."],"explanation":"Les magasins à forte demande peuvent choisir des horaires plus longs, sans que ces horaires causent la demande.","hint":"Une corrélation ne suffit pas à prouver la cause."},"en":{"prompt":"Which reasoning error weakens the argument?","context":"Stores open late sell more. A merchant concludes that staying open late necessarily increases sales.","choices":["Comparing two stores.","Using sales figures.","Observing a correlation.","Reasoning about opening hours.","Confusing correlation with causation."],"explanation":"High-demand stores may choose longer opening hours; correlation alone does not establish causation.","hint":"Correlation is not proof of causation."}}},{"id":"T-A-05","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":3,"estimatedSeconds":135,"correctAnswer":"0","status":"pilot","content":{"fr":{"prompt":"Quel élément renforce le mieux la conclusion que la méthode B a aidé ?","context":"Un lycée teste deux méthodes de révision sur des groupes comparables constitués par tirage au sort. Le groupe B obtient une meilleure note moyenne.","choices":["Les deux groupes ont passé le même examen dans les mêmes conditions.","Le groupe B utilise des stylos bleus.","Le lycée est situé en centre-ville.","Les deux méthodes ont des noms différents.","Les enseignants aiment les statistiques."],"explanation":"Un test identique réduit une source de différence étrangère à la méthode.","hint":"Quelle variable parasite peux-tu éliminer ?"},"en":{"prompt":"What most strengthens the conclusion that method B helped?","context":"A school randomly assigns comparable students to two study methods. Group B obtains a higher average grade.","choices":["Both groups took the same examination under the same conditions.","Group B used blue pens.","The school is downtown.","The methods have different names.","Teachers like statistics."],"explanation":"An identical test reduces a competing explanation for the score difference.","hint":"Which confounding variable can be ruled out?"}}},{"id":"T-A-06","exam":"tage","game":"argument-lab","competency":"critical-reasoning","difficulty":4,"estimatedSeconds":155,"correctAnswer":"3","status":"pilot","content":{"fr":{"prompt":"Quel point manque au raisonnement ?","context":"Une entreprise affirme : « Tous nos clients qui utilisent l’application sont satisfaits. Donc tous nos clients sont satisfaits. »","choices":["Le prix de l’application.","La couleur du logo.","L’âge de l’entreprise.","La satisfaction des clients qui n’utilisent pas l’application.","Le nombre de développeurs."],"explanation":"La prémisse ne dit rien sur les clients hors application.","hint":"Quel groupe est absent de la prémisse ?"},"en":{"prompt":"What is missing from the reasoning?","context":"A company says: “All our clients who use the app are satisfied. Therefore all our clients are satisfied.”","choices":["The app’s price.","The logo color.","The firm’s age.","Satisfaction among customers who do not use the app.","The number of developers."],"explanation":"The premise gives no information about customers who do not use the app.","hint":"Which group is missing from the premise?"}}},{"id":"G-A-07","exam":"gmat","game":"argument-lab","competency":"critical-reasoning","difficulty":1,"estimatedSeconds":95,"correctAnswer":"0","status":"pilot","content":{"fr":{"promp sed. Management credits the new schedule.","choices":["Workers prefer shorter meetings.","The factory makes several products.","New automated machinery was installed at the same time.","The schedule was announced in advance.","Hourly output is measurable."],"explanation":"Automation offers a strong competing cause of higher hourly productivity.","hint":"Look for another simultaneous change."}}},{"id":"G-A-09","exam":"gmat","game":"argument-lab","competency":"critical-reasoning","difficulty":3,"estimatedSeconds":135,"correctAnswer":"3","status":"pilot","content":{"fr":{"prompt":"Which assumption is necessary for the plan to reduce total costs?","context":"A firm proposes mandatory training to reduce turnover costs, arguing that trained staff stay longer.","choices":["Training takes place on Tuesdays.","The company has a website.","All staff enjoy training equally.","Savings from reduced turnover will exceed the added training costs.","Training requires an external consultant."],"explanation":"Le coût total ne baisse que si les économies compensent le coût de la formation.","hint":"Compare économies et coûts ajoutés."},"en":{"prompt":"Which assumption is necessary for the plan to reduce total costs?","context":"A firm proposes mandatory training to reduce turnover costs, arguing that trained staff stay longer.","choices":["Training takes place on Tuesdays.","The company has a website.","All staff enjoy training equally.","Savings from reduced turnover will exceed the added training costs.","Training requires an external consultant."],"explanation":"Total costs decline only if turnover savings outweigh training expense.","hint":"Compare savings with added costs."}}},{"id":"G-A-10","exam":"gmat","game":"argument-lab","competency":"critical-reasoning","difficulty":2,"estimatedSeconds":115,"correctAnswer":"1","status":"pilot","content":{"fr":{"prompt":"Which conclusion necessarily follows?","context":"Every employee with a laboratory access permit has completed safety training. Dana has such a permit.","choices":["Dana supervises the laboratory.","Dana has completed safety training.","Every trained employee has a permit.","Dana trained the other employees.","All employees have permits."],"explanation":"Le permis implique une formation achevée ; Dana possède le permis.","hint":"Applique l’implication, pas sa réciproque."},"en":{"prompt":"Which conclusion necessarily follows?","context":"Every employee with a laboratory access permit has completed safety training. Dana has such a permit.","choices":["Dana supervises the laboratory.","Dana has completed safety training.","Every trained employee has a permit.","Dana trained the other employees.","All employees have permits."],"explanation":"A permit implies completed safety training, and Dana holds a permit.","hint":"Apply the implication, not its converse."}}},{"id":"G-A-11","exam":"gmat","game":"argument-lab","competency":"critical-reasoning","difficulty":3,"estimatedSeconds":135,"correctAnswer":"4","status":"pilot","content":{"fr":{"prompt":"Which information most seriously challenges that conclusion?","context":"A city lowered bus fares and bus ridership rose. Officials attribute the increase entirely to lower fares.","choices":["Buses are painted blue.","Some riders pay cash.","The city has a river.","Bus fares are displayed at stops.","The subway line was closed for repairs over the same period."],"explanation":"La fermeture du métro peut expliquer la hausse d’usage des bus indépendamment du prix.","hint":"Quel autre transport a pu changer ?"},"en":{"prompt":"Which information most seriously challenges that conclusion?","context":"A city lowered bus fares and bus ridership rose. Officials attribute the increase entirely to lower fares.","choices":["Buses are painted blue.","Some riders pay cash.","The city has a river.","Bus fares are displayed at stops.","The subway line was closed for repairs over the same period."],"explanation":"A subway closure offers an independent explanation for rising bus demand.","hint":"What else changed in public transport?"}}},{"id":"G-A-12","exam":"gmat","game":"argument-lab","competency":"critical-reasoning","difficulty":4,"estimatedSeconds":155,"correctAnswer":"2","status":"pilot","content":{"fr":{"prompt":"What is the main flaw in the conclusion?","context":"A food producer tested a new coating in one cool, dry warehouse, then concluded that it extends shelf life in every climate.","choices":["The test used warehouse shelves.","The test was conducted on packaged food.","Results in one climate may not generalize to all climates.","Some products last longer than others.","The coating was applied by staff."],"explanation":"Les conditions de température et d’humidité pourraient modifier le résultat.","hint":"Regarde où la conclusion va au-delà de l’échantillon."},"en":{"prompt":"What is the main flaw in the conclusion?","context":"A food producer tested a new coating in one cool, dry warehouse, then concluded that it extends shelf life in every climate.","choices":["The test used warehouse shelves.","The test was conducted on packaged food.","Results in one climate may not generalize to all climates.","Some products last longer than others.","The coating was applied by staff."],"explanation":"Temperature and humidity might affect performance, so the tested setting may not generalize.","hint":"Spot where the conclusion exceeds the tested sample."}}},{"id":"T-D-01","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":1,"estimatedSeconds":100,"correctAnswer":"A","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x (nombre réel) ?","statements":["x + 3 = 11","x est pair (entier)."],"explanation":"(1) impose x = 8. (2) admet de nombreux entiers pairs.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is the value of real number x?","statements":["x + 3 = 11","x is an even integer."],"explanation":"(1) fixes x = 8. (2) allows many even integers.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"T-D-02","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":1,"estimatedSeconds":100,"correctAnswer":"B","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x (nombre réel) ?","statements":["x > 0","2x = 16"],"explanation":"(1) ne donne pas une valeur unique ; (2) impose x = 8.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is the value of real number x?","statements":["x > 0","2x = 16"],"explanation":"(1) does not fix a unique value; (2) fixes x = 8.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"T-D-03","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":2,"estimatedSeconds":120,"correctAnswer":"C","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x (x et y réels) ?","statements":["x + y = 10","y = 4"],"explanation":"Chaque information laisse une inconnue libre ; ensemble, x = 6.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is x, given real numbers x and y?","statements":["x + y = 10","y = 4"],"explanation":"Each statement alone leaves x undetermined; together x = 6.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"T-D-04","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":2,"estimatedSeconds":120,"correctAnswer":"D","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x, sachant x > 0 ?","statements":["x² = 25","x − 2 = 3"],"explanation":"(1) avec x positif fixe x = 5 ; (2) fixe aussi x = 5.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is x, given x > 0?","statements":["x² = 25","x − 2 = 3"],"explanation":"(1) and x > 0 fix x = 5; (2) also fixes x = 5.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"T-D-05","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":3,"estimatedSeconds":140,"correctAnswer":"E","status":"pilot","content":{"fr":{"prompt":"L’entier n est-il pair ?","statements":["n > 4","n < 8"],"explanation":"Ensemble, n peut valoir 5, 6 ou 7 : la parité n’est pas déterminée.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"Is integer n even?","statements":["n > 4","n < 8"],"explanation":"Together, n can be 5, 6, or 7; parity is not fixed.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"T-D-06","exam":"tage","game":"enough-info","competency":"data-sufficiency","difficulty":4,"estimatedSeconds":160,"correctAnswer":"B","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x, nombre réel ?","statements":["x est strictement négatif.","3x + 6 = 0"],"explanation":"(1) laisse de nombreuses valeurs ; (2) donne x = −2.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is real number x?","statements":["x is strictly negative.","3x + 6 = 0"],"explanation":"(1) allows many values; (2) fixes x = −2.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-07","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":1,"estimatedSeconds":100,"correctAnswer":"D","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur de x, sachant que x est un réel strictement positif ?","statements":["x² = 49","3x = 21"],"explanation":"La positivité permet de déduire x = 7 de (1) ; (2) donne aussi x = 7.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is x, given that x is a positive real number?","statements":["x² = 49","3x = 21"],"explanation":"Positivity fixes x = 7 from (1); (2) also fixes x = 7.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-08","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":2,"estimatedSeconds":120,"correctAnswer":"A","status":"pilot","content":{"fr":{"prompt":"Le réel non nul x est-il positif ?","statements":["x³ > 0","x² = 4"],"explanation":"(1) implique x > 0. (2) permet x = 2 ou x = −2.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"Is x positive, given x is a nonzero real number?","statements":["x³ > 0","x² = 4"],"explanation":"(1) implies x > 0; (2) allows either x = 2 or x = −2.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-09","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":2,"estimatedSeconds":120,"correctAnswer":"C","status":"pilot","content":{"fr":{"prompt":"Quel est le coût total de n articles identiques, sachant que n est un entier positif et que le prix unitaire p est positif ?","statements":["n = 8","p = 5"],"explanation":"Il faut connaître à la fois le nombre d’articles et le prix unitaire : 8 × 5 = 40.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is the total cost of n identical items, given n is a positive integer and unit price p is positive?","statements":["n = 8","p = 5"],"explanation":"Both item count and unit price are necessary: 8 × 5 = 40.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-10","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":3,"estimatedSeconds":140,"correctAnswer":"C","status":"pilot","content":{"fr":{"prompt":"Quelle est la valeur du réel x ?","statements":["x² = 9","x < 0"],"explanation":"(1) laisse ±3 ; (2) seule ne fixe rien ; ensemble, x = −3.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"What is the value of real number x?","statements":["x² = 9","x < 0"],"explanation":"(1) allows ±3; (2) alone is not enough; together they fix x = −3.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-11","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":3,"estimatedSeconds":140,"correctAnswer":"D","status":"pilot","content":{"fr":{"prompt":"L’entier positif n est-il divisible par 3 ?","statements":["n est divisible par 6.","n est divisible par 9."],"explanation":"Un multiple de 6 ou de 9 est nécessairement divisible par 3.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"Is positive integer n divisible by 3?","statements":["n is divisible by 6.","n is divisible by 9."],"explanation":"Any multiple of 6 or 9 is divisible by 3.","hint":"Test (1) and (2) separately before combining them."}}},{"id":"G-D-12","exam":"gmat","game":"enough-info","competency":"data-sufficiency","difficulty":4,"estimatedSeconds":160,"correctAnswer":"E","status":"pilot","content":{"fr":{"prompt":"Le réel x est-il strictement supérieur à 1 ?","statements":["x > 0","x < 2"],"explanation":"Même ensemble, 0 < x < 2 permet x = 0,5 ou x = 1,5 : on ne peut trancher.","hint":"Teste (1) puis (2) isolément avant de les combiner."},"en":{"prompt":"Is real number x greater than 1?","statements":["x > 0","x < 2"],"explanation":"Even together, 0 < x < 2 allows x = 0.5 or x = 1.5, so the answer is unknown.","hint":"Test (1) and (2) separately before combining them."}}}]</script><script>
const Q=JSON.parse(document.querySelector('#bank').textContent),STORAGE='reasoning-arcade:offline-preview:v1';
let lang='fr',exam='tage',page='home',game='code-logic',mode='game',attempts=[],used=[],cur=null,choice=null,checked=false,hint=false,seconds=0,limit=0,queue=[],tick=null,skill=read();
const G=['code-logic','argument-lab','enough-info'];const names={'code-logic':'Code Logic','argument-lab':'Argument Lab','enough-info':'Enough Info?'};
const T={fr:{headline:'La logique, <span>à ton rythme.</span>',desc:'Des jeux courts. Des explications utiles. Une difficulté qui évolue avec toi.',choose:'Choisis ton parcours',games:'Choisis ton défi',play:'Jouer',test:'Mini-test',logic:'Découvre les règles numériques.',argument:'Analyse les arguments cachés.',enough:'Les données suffisent-elles ?',next:'Question suivante',verify:'Vérifier',hint:'Voir un indice',explanation:'Explication',complete:'Bilan de la session',back:'← Accueil',correct:'Bonne réponse',wrong:'À revoir',time:'Temps',level:'Niveau',try:'Rejouer',progress:'Ma progression',attempts:'Questions résolues',accuracy:'Réussite',warning:'Questions pilotes : validation éditoriale nécessaire avant une publication comme préparation aux concours.',missing:'Aucune question disponible',suff:['(1) seule suffit','(2) seule suffit','Ensemble uniquement','Chacune seule suffit','Même ensemble insuffisantes']},en:{headline:'Better thinking, <span>one game at a time.</span>',desc:'Short games. Clear explanations. Difficulty that adapts to your progress.',choose:'Choose your track',games:'Choose your challenge',play:'Play',test:'Mini-test',logic:'Discover number patterns.',argument:'Analyze arguments and assumptions.',enough:'Is the information sufficient?',next:'Next question',verify:'Check',hint:'Show a hint',explanation:'Explanation',complete:'Session results',back:'← Home',correct:'Correct',wrong:'Review',time:'Time',level:'Level',try:'Play again',progress:'My progress',attempts:'Questions attempted',accuracy:'Accuracy',warning:'Pilot questions: editorial validation required before public exam-prep launch.',missing:'No questions available',suff:['Statement (1) alone','Statement (2) alone','Both together only','Each alone','Neither, even together']}};
function read(){try{return JSON.parse(localStorage.getItem(STORAGE))||{skills:{},total:0,correct:0}}catch{return {skills:{},total:0,correct:0}}}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(skill))}catch{}}function t(k){return T[lang][k]}function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleLang(){lang=lang==='fr'?'en':'fr';document.documentElement.lang=lang;document.querySelector('#langbtn').textContent=lang==='fr'?'EN':'FR';render()}
function home(){clearInterval(tick);page='home';render()}
function selectExam(e){exam=e;render()}
function filtered(g){return Q.filter(q=>q.exam===exam&&(g==='mixed'||q.game===g))}
function nextAdaptive(){let avail=filtered(game).filter(q=>!used.includes(q.id));avail.sort((a,b)=>{let ak=a.exam+':'+a.game+':'+a.competency,bk=b.exam+':'+b.game+':'+b.competency,al=(skill.skills[ak]||{level:2}).level,bl=(skill.skills[bk]||{level:2}).level;return Math.abs(a.difficulty-al)-Math.abs(b.difficulty-bl)||a.id.localeCompare(b.id)});return avail[0]||null}
function begin(g,m){game=g;mode=m;page='play';attempts=[];used=[];choice=null;checked=false;hint=false;seconds=0;queue=[];if(m==='exam'){let p=filtered(g).sort((a,b)=>a.difficulty-b.difficulty||a.id.localeCompare(b.id));while(p.length&&queue.length<(g==='mixed'?6:5))queue.push(p.splice(Math.floor((p.length-1)/2),1)[0]);limit=queue.length*80;cur=queue[0]||null}else{limit=5;cur=nextAdaptive()}clearInterval(tick);tick=setInterval(()=>{if(page!=='play'||(mode==='game'&&checked))return;seconds++;if(mode==='exam'&&seconds>=limit){finish();return}document.querySelector('#clock')&&(document.querySelector('#clock').textContent=clock(mode==='exam'?limit-seconds:seconds))},1000);render()}
function clock(n){n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function answer(v){if(checked)return;choice=v;render()}
function check(){if(choice==null||checked||!cur)return;const correct=choice===cur.correctAnswer;attempts.push({q:cur,choice,correct});used.push(cur.id);let k=cur.exam+':'+cur.game+':'+cur.competency,s=skill.skills[k]||{level:2,yes:0,no:0};s.yes=correct?s.yes+1:0;s.no=correct?0:s.no+1;if(s.yes>=2){s.level=Math.min(5,s.level+1);s.yes=0}if(s.no>=2){s.level=Math.max(1,s.level-1);s.no=0}skill.skills[k]=s;skill.total++;skill.correct+=correct?1:0;save();if(mode==='exam'){if(attempts.length>=queue.length)finish();else{cur=queue[attempts.length];choice=null;render()}}else{checked=true;render()}}
function advance(){if(attempts.length>=5){finish();return}cur=nextAdaptive();if(!cur){finish();return}choice=null;checked=false;hint=false;render()}
function finish(){clearInterval(tick);page='results';render()}
function render(){document.querySelector('#app').innerHTML=page==='home'?renderHome():page==='play'?renderPlay():renderResults()}
function renderHome(){const cards=G.filter(g=>g!=='code-logic'||exam==='tage').map((g,i)=>`<article class="card"><div class="card-art">${g==='code-logic'?'◇':g==='argument-lab'?'✧':'∑'}</div><div class="card-inner"><span class="tag">0${i+1} / ${g==='code-logic'?'PATTERNS':g==='argument-lab'?'REASONING':'DATA'}</span><h3>${names[g]}</h3><p>${t(g==='code-logic'?'logic':g==='argument-lab'?'argument':'enough')}</p><div class="actions"><button class="btn" onclick="begin('${g}','game')">${t('play')} ↗</button><button class="btn secondary" onclick="begin('${g}','exam')">${t('test')} ◷</button></div></div></article>`).join('');return `<section class="hero"><div><span class="tag">✦ THINK SMARTER, PLAY BETTER</span><h1>${t('headline')}</h1><p>${t('desc')}</p><button class="btn" onclick="document.querySelector('#choose').scrollIntoView({behavior:'smooth'})">${t('play')} ↗</button><p class="subtle">3 games · 36 original pilot questions · €0</p></div><div class="hero-visual"><div class="float">7 · 14 · 28 · ?<small>FIND THE PATTERN</small></div><div class="float second">IF → THEN<small>CRITICAL REASONING</small></div></div></section><section id="choose"><span class="tag">01 / YOUR TRACK</span><h2 class="section-title">${t('choose')}</h2><div class="tabs"><button class="tab ${exam==='tage'?'selected':''}" onclick="selectExam('tage')">TAGE MAGE</button><button class="tab ${exam==='gmat'?'selected':''}" onclick="selectExam('gmat')">GMAT</button></div></section><section><span class="tag">02 / LET’S PLAY</span><h2 class="section-title">${t('games')}</h2><p class="section-desc">${lang==='fr'?'Deux modes : entraînement adaptatif ou mini-test chronométré.':'Two modes: adaptive practice or a timed mini-test.'}</p><div class="cards">${cards}</div><button class="btn secondary" style="margin-top:18px" onclick="begin('mixed','exam')">${t('test')} · Mix →</button></section><section class="stats"><div><span class="tag">03 / ${t('progress')}</span><br><strong>${skill.total}</strong> <span>${t('attempts')}</span></div><div><strong>${skill.total?Math.round(skill.correct*100/skill.total):0}%</strong> <span>${t('accuracy')}</span></div><div class="subtle">Local only · No account</div></section><p class="notice">${t('warning')}</p>`}
function renderPlay(){if(!cur)return `<div class="play"><h2>${t('missing')}</h2><button class="btn" onclick="home()">${t('back')}</button></div>`;const c=cur.content[lang],opts=cur.game==='enough-info'?['A','B','C','D','E']:[0,1,2,3,4].map(String);let max=mode==='exam'?queue.length:5,idx=attempts.length+(checked?0:1),progress=Math.min(100,Math.round(attempts.length/max*100));return `<div class="play"><div class="playhead"><button class="topbtn" onclick="home()">${t('back')}</button><span class="tag">${exam.toUpperCase()} · ${mode==='game'?'GAME MODE':'MINI-TEST'}</span></div><div class="subtle">${lang==='fr'?'Question':'Question'} ${idx}/${max} · ${t('level')} ${cur.difficulty}/5</div><div class="pbar"><div style="width:${progress}%"></div></div><section class="quiz"><div class="playhead"><span class="tag">${html(names[cur.game])} / ${html(cur.competency)}</span><strong id="clock">◷ ${clock(mode==='exam'?limit-seconds:seconds)}</strong></div><h1>${html(c.prompt)}</h1>${c.context?`<div class="questiondata">${html(c.context)}</div>`:''}${c.statements?c.statements.map((s,i)=>`<div class="statement"><b>${i+1}.</b> ${html(s)}</div>`).join(''):''}<div class="bar"></div><strong>${lang==='fr'?'Ta réponse':'Your answer'}</strong><div>${opts.map((v,i)=>{let label=cur.game==='enough-info'?t('suff')[i]:c.choices[i],cl=choice===v?' sel':'';if(checked&&v===cur.correctAnswer)cl+=' good';if(checked&&v===choice&&v!==cur.correctAnswer)cl+=' bad';return `<button class="answer${cl}" ${checked?'disabled':''} onclick="answer('${v}')"><span class="letter">${String.fromCharCode(65+i)}</span><span>${html(label)}</span></button>`}).join('')}</div>${mode==='game'&&!checked?`<button class="hint" onclick="hint=!hint;render()">✧ ${t('hint')}</button>${hint?`<div class="notice">${html(c.hint)}</div>`:''}`:''}${checked?`<div class="feedback ${choice===cur.correctAnswer?'':'bad'}"><strong>${choice===cur.correctAnswer?t('correct'):t('wrong')}</strong><p>${t('explanation')}: ${html(c.explanation)}</p></div>`:''}<div class="quizbottom"><span class="muted">${lang==='fr'?'Sauvegarde locale':'Local progress'}</span>${checked?`<button class="btn" onclick="advance()">${t('next')} →</button>`:`<button class="btn" ${choice==null?'disabled':''} onclick="check()">${t('verify')} →</button>`}</div></section></div>`}
function renderResults(){let right=attempts.filter(a=>a.correct).length,max=mode==='exam'?queue.length:5;return `<div class="play results"><button class="topbtn" onclick="home()">${t('back')}</button><section class="quiz" style="margin-top:20px"><span class="tag">SESSION COMPLETE</span><div class="score">${max?Math.round(right/max*100):0}%</div><h1>${t('complete')}</h1><p>${right} / ${max} ${lang==='fr'?'bonnes réponses':'correct answers'}</p><button class="btn" onclick="begin('${game}','${mode}')">${t('try')} ↻</button><h2 style="text-align:left;margin-top:32px">${t('explanation')}</h2>${attempts.map((a,i)=>`<div class="review"><b>${a.correct?'✓':'×'} ${i+1}. ${html(a.q.content[lang].prompt)}</b><p>${html(a.q.content[lang].explanation)}</p></div>`).join('')}</section></div>`}
render();
</script></body></html>
