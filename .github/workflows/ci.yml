name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Pin Playwright apt dependencies to a tested Ubuntu LTS image; latest resolved to 26.04
    # where required font packages are unavailable (CI run 44132435640).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:questions
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /reasoning-arcade
      - name: Assemble static route test server
        run: mkdir -p .site/reasoning-arcade && cp -r out/. .site/reasoning-arcade/
      - name: Build offline editorial review packet
        run: npm run build:review-pack
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload offline reviewer packet after successful tests
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-arcade-offline-review
          path: review-pack/reasoning-arcade-editorial-review.html
          if-no-files-found: error
          retention-days: 14
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 3
