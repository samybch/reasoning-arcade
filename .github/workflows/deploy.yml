name: Deploy manual preview to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "After completed legal and educational release gates, type I_APPROVE_PUBLIC_LAUNCH"
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.inputs.release_confirmation == 'I_APPROVE_PUBLIC_LAUNCH'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:questions && npm test && npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /reasoning-arcade
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
